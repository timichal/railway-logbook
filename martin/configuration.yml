# Martin Tile Server Configuration
# Configuration for serving vector tiles from PostgreSQL/PostGIS

# PostgreSQL connection (from environment variable)
postgres:
  connection_string: ${DATABASE_URL}

  # Connection pool settings for performance
  pool_size: 20

  # Disable auto-discovery of tables/functions
  # We explicitly define our tile sources below
  auto_publish: false

  # Function sources - PostgreSQL functions that generate vector tiles
  functions:
    # Railway parts (raw OSM segments)
    railway_parts_tile:
      schema: public
      function: railway_parts_tile
      minzoom: 4
      maxzoom: 18
      # This function accepts z, x, y parameters

    # Railway routes (combined lines with metadata), with no user: every route
    # reads as unvisited. Accepts z, x, y, and query_params (selected_countries).
    #
    # Everything published here answers anyone who asks, so nothing user-specific
    # may be. The tile coloured by a user's rides is railway_routes_mvt, served by
    # the Next route handler under src/app/api/tiles once it has resolved the
    # session or share token — never add that function here.
    railway_routes_tile:
      schema: public
      function: railway_routes_tile
      minzoom: 4
      maxzoom: 18

    # Stations (point features) — all of them, admin map
    stations_tile:
      schema: public
      function: stations_tile
      minzoom: 9
      maxzoom: 18
      # This function accepts z, x, y parameters

    # Stations within 250m of an admin-defined route (near_route) — user map
    public_stations_tile:
      schema: public
      function: public_stations_tile
      minzoom: 9
      maxzoom: 18
      # This function accepts z, x, y parameters

    # Admin notes (admin-only annotations)
    admin_notes_tile:
      schema: public
      function: admin_notes_tile
      minzoom: 4
      maxzoom: 18
      # This function accepts z, x, y parameters

    # Public notes (note_type='Usage' only) shown on the user map
    public_notes_tile:
      schema: public
      function: public_notes_tile
      minzoom: 4
      maxzoom: 18
      # This function accepts z, x, y parameters

# Cache configuration - disable caching for dynamic data
cache_size_mb: 0

# Server configuration
listen_addresses: "0.0.0.0:3000"

# Disable automatic bounds calculation on startup (improves startup time)
auto_bounds: skip

# Enable CORS for web access
cors: true
