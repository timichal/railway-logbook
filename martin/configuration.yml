# Martin Tile Server Configuration
# Configuration for serving vector tiles from PostgreSQL/PostGIS

# PostgreSQL connection (from environment variable)
postgres:
  # Not DATABASE_URL: Martin also reads that one on its own, as a deprecated
  # fallback, and warns about it at startup.
  connection_string: ${TILES_DATABASE_URL}

  # Connection pool settings for performance
  pool_size: 20

  # Disable auto-discovery of tables/functions
  # We explicitly define our tile sources below
  auto_publish: false

  # No source is kept in Martin's memory cache unless it says so. They answer from
  # tables that change under them (a route save moves near_route, a note save the
  # notes), and the cache would serve the old tile until evicted.
  cache: disable

  # Function sources - PostgreSQL functions that generate vector tiles
  functions:
    # Railway parts (raw OSM segments)
    railway_parts_tile:
      schema: public
      function: railway_parts_tile
      minzoom: 4
      maxzoom: 18
      # This function accepts z, x, y parameters
    # Railway routes, the same for everyone. Geometry and the styling and filter
    # attributes only: no text (names, note, tags, link), which the clients read
    # by track_id, and no rides, which they lay over the tile by id
    # (src/lib/shared/map/routeRides.ts). Accepts z, x, y, and query_params
    # (selected_countries).
    #
    # Everything published here answers anyone who asks, so nothing user-specific
    # may be.
    railway_routes_tile:
      schema: public
      function: railway_routes_tile
      minzoom: 4
      maxzoom: 18
    # The same function under a URL that carries its version (`v`, from
    # src/lib/routesTileVersion.ts), which moves with every route write and every
    # change to the tile's SQL. So one URL is always the same tile, served
    # immutable and kept in Martin's memory cache. That cache is keyed on the raw
    # query string, which the clients build in one fixed order (tileSources.ts).
    # Only a URL with a current version may come here; the admin map and the
    # native app still use the uncached source above. Martin warns at startup that
    # two sources run one function, which is intended.
    railway_routes_tile_versioned:
      schema: public
      function: railway_routes_tile
      minzoom: 4
      maxzoom: 18
      cache_control: "public, max-age=31536000, immutable"
      # Martin keeps only z4-z12: the low-zoom tiles every page load asks for and
      # that cost the most to draw. The many small high-zoom tiles one user pans
      # through would otherwise push them out of the LRU. The browser keeps every
      # zoom (cache_control).
      cache:
        minzoom: 4
        maxzoom: 12

    # Stations (point features) — all of them, admin map
    stations_tile:
      schema: public
      function: stations_tile
      minzoom: 9
      maxzoom: 18
      # This function accepts z, x, y parameters
    # Stations within 250m of an admin-defined route (near_route) — user map
    public_stations_tile:
      schema: public
      function: public_stations_tile
      minzoom: 9
      maxzoom: 18
      # This function accepts z, x, y parameters
    # Scenic lines (admin-drawn stretches of track, highlight only) — both maps.
    # The user map filters them by country client-side.
    scenic_lines_tile:
      schema: public
      function: scenic_lines_tile
      minzoom: 4
      maxzoom: 18

    # No admin_notes_tile: it carries every note, drafts included, and Martin
    # answers anyone. The admin map gets it from the Next handler under
    # src/app/api/tiles/admin_notes, which checks for the admin — never add it here.

    # Public notes (note_type='Usage' only) shown on the user map
    public_notes_tile:
      schema: public
      function: public_notes_tile
      minzoom: 4
      maxzoom: 18
      # This function accepts z, x, y parameters
# Martin's memory cache, for the one source that opts in above
# (railway_routes_tile_versioned). Sized for the 4GB server next to Postgres
# (shared_buffers=1GB) and Node. Every tile is weighed by its bytes, and the
# tiles of an old version age out by LRU.
cache:
  size_mb: 128
  tile_size_mb: 128

# Server configuration
listen_addresses: "0.0.0.0:3000"

# Enable CORS for web access
cors: true
