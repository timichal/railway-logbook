name: railway-logbook

services:
  db:
    # Pinned by digest, like Martin below. The official image rather than
    # imresamu/postgis: that one's alpine tags stopped being rebuilt at 18.1 in
    # February 2026 while still being re-pushed, so pulling it never moved. This one
    # is amd64 only - an arm64 Mac runs it emulated. Stay on Alpine: the databases
    # use the libc provider, and moving from musl to glibc would change collation
    # order under every text index.
    image: postgis/postgis:18-3.6-alpine@sha256:ffcf0c4b904e41b9779f8098007fb5a9484025319c18c70cf8e1bcebb742b9b7
    # Named so an arm64 machine pulls the amd64 image instead of finding no match.
    platform: linux/amd64
    container_name: db
    # Sized for the 4GB server (osmium-scripts/CLAUDE.md), which also runs the app,
    # Martin and the map data pipeline. Changing any of this recreates the container,
    # i.e. restarts Postgres mid-deploy: take backupRouteData first.
    # - jit off: PostGIS functions carry high cost estimates, which push cheap
    #   queries over JIT's threshold. It added ~435ms of compile time to a 5ms
    #   station proximity query, and no query here runs long enough to repay it.
    # - shared_buffers ~25% of RAM (the default 128MB is less than the railway_parts
    #   indexes alone; the table is ~834MB). Filled as pages are read, and a map
    #   import or recalculation reads enough to fill it, so count the whole 1GB as
    #   taken when sizing anything beside it.
    # - maintenance_work_mem for vacuum and index builds, which a map import leaves
    #   plenty of. autovacuum_work_mem caps each autovacuum worker separately (it
    #   would otherwise take maintenance_work_mem, times up to three workers, all
    #   busy right after an import).
    # - pg_stat_statements, to see which queries the real traffic spends on. Its
    #   extension is created in 02-vector-tiles.sql; the library must be preloaded.
    command: >-
      postgres
      -c jit=off
      -c shared_buffers=1GB
      -c maintenance_work_mem=256MB
      -c autovacuum_work_mem=64MB
      -c shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  tiles:
    # Pinned by digest: a moving tag is pulled once per machine and never again, so
    # it means whatever was newest the day a machine first pulled it. Upgrading is
    # a change to make and test on purpose - bump the tag and the digest together
    # (the digest of the multi-arch index, `docker buildx imagetools inspect`).
    image: ghcr.io/maplibre/martin:1.16.1@sha256:59902019bf9038926ff0c71174237d6852e64c457830a6349abe7090be8818ca
    container_name: tiles
    restart: always
    ports:
      - 127.0.0.1:3001:3000
    environment:
      - TILES_DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./martin:/config
    command: --config /config/configuration.yml
    depends_on:
      - db

  frontend:
    image: railway-logbook
    container_name: frontend
    restart: always
    ports:
      - 127.0.0.1:3000:3000
    environment:
      - DB_HOST=db
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - JWT_SECRET=${JWT_SECRET}
      - MARTIN_URL=http://tiles:3000
    depends_on:
      - db
      - tiles

volumes:
  postgres_data:
